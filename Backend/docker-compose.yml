
services:
  postgresdb:
    image: postgres:17
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'

  valkey:
    image: valkey/valkey
    ports:
      - 6379:6379

volumes:
  postgres_data: